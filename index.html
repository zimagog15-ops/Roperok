<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radio Roperok</title>
  <style>
    :root {
      --bg-dark: #050508;
      --panel: rgba(15, 15, 22, 0.9);
      --accent: #ff3366;
      --accent-dark: #cc0033;
      --text: #ffffff;
      --muted: #aaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #11111a, var(--bg-dark));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 51, 102, 0.1);
    }

    .logo-area h1 {
      font-size: 22px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .logo-area p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .track-info {
      text-align: left;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 16px;
    }

    .track-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      color: var(--muted);
      font-size: 13px;
    }

    audio {
      width: 100%;
      margin-top: 8px;
    }

    .btn-play {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-play:active {
      transform: scale(0.96);
    }

    .playlist-list {
      margin-top: 20px;
      text-align: left;
      max-height: 220px;
      overflow-y: auto;
    }

    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }

    .playlist-item:last-child {
      border-bottom: none;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .playlist-title {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .playlist-duration {
      font-size: 13px;
      color: var(--muted);
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <h1>Radio Roperok</h1>
      <p>Твой персональный музыкальный поток</p>
    </div>

    <div class="player-controls">
      <div class="track-info">
        <div class="track-title" id="track-title">Выберите трек</div>
        <div class="track-artist" id="track-artist"></div>
      </div>

      <audio id="audio-player" preload="metadata"></audio>

      <button class="btn-play" id="play-btn" onclick="togglePlay()">▶ Воспроизвести</button>
    </div>

    <div class="playlist-list" id="playlist">
      <!-- Сюда JS добавит список треков -->
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const playlistEl = document.getElementById('playlist');

    // Сюда вставляй прямые HTTPS-ссылки на MP3 (не страницы, а именно файлы)
    const tracks = [
      {
        title: 'Трек 1',
        artist: 'Roperok',
        src: '' // например: 'https://example.com/tracks/track1.mp3'
      },
      {
        title: 'Трек 2',
        artist: 'Roperok',
        src: ''
      },
      {
        title: 'Трек 3',
        artist: 'Roperok',
        src: ''
      }
    ];

    let currentTrackIndex = -1;

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'playlist-item';
        item.textContent = track.title;
        item.onclick = () => playTrack(index);
        playlistEl.appendChild(item);
      });
    }

    function playTrack(index) {
      currentTrackIndex = index;
      const track = tracks[index];
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      audio.src = track.src;
      togglePlay();
    }

    function togglePlay() {
      if (audio.paused || audio.ended) {
        audio.play().catch(e => {
          console.error('Автовоспроизведение заблокировано браузером', e);
          alert('Нажмите кнопку ещё раз — браузер требует взаимодействия пользователя.');
        });
        playBtn.textContent = '⏸ Пауза';
      } else {
        audio.pause();
        playBtn.textContent = '▶ Воспроизвести';
      }
    }

    audio.onended = () => {
      const nextIndex = currentTrackIndex + 1;
      if (nextIndex < tracks.length) {
        playTrack(nextIndex);
      } else {
        togglePlay();
      }
    };

    renderPlaylist();
  </script>
</body>
</html>
